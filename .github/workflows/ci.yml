name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: PUMPFUN_ALPHA_RESEARCH_V2_2/requirements.txt
      - run: pip install -r PUMPFUN_ALPHA_RESEARCH_V2_2/requirements.txt
      - run: python -m pytest PUMPFUN_ALPHA_RESEARCH_V2_2/tests -q -W ignore
