server {
    listen 80;
    server_name _;
    root /srv/PUMPFUN_ALPHA_RESEARCH_V2_2/dashboard;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Older dashboards stay available next to V2.2
    location /v1/   { alias /srv/PUMPFUN_ALPHA_RESEARCH_V1/dashboard/; }
    location /v2/   { alias /srv/PUMPFUN_ALPHA_RESEARCH_V2/dashboard/; }
    location /v2_1/ { alias /srv/PUMPFUN_ALPHA_RESEARCH_V2_1/dashboard/; }

    location ~ /\. { deny all; }
}
